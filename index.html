<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسابقات PUBG</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #101010;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    .card {
      background: #1c1c1c;
      padding: 18px;
      border-radius: 15px;
      margin-top: 15px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      background: #2ecc71;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      background: #555;
    }

    #message {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🏆 مسابقات PUBG</h1>

  <div class="card">
    <h3>ثبت نام مسابقه</h3>

    <p>ظرفیت: <b id="count">...</b> / 100</p>

    <input id="uid" type="text" placeholder="UID اکانت PUBG">

    <input id="playerName" type="text" placeholder="اسم داخل بازی">

    <button id="registerBtn">ثبت نام</button>

    <div id="message"></div>
  </div>

  <div class="card">
    <h3>📜 قوانین</h3>
    <p>• اطلاعات خود را درست وارد کنید.</p>
    <p>• هر بازیکن فقط یک بار ثبت نام کند.</p>
    <p>• ظرفیت مسابقه ۱۰۰ نفر است.</p>
  </div>

</div>

<script>
  // اطلاعات Supabase
  const SUPABASE_URL = "https://vwcavnwihbmyyrjqgyvi.supabase.co";

  // اینجا Publishable Key خودت را قرار بده
  const SUPABASE_KEY = "sb_publishable_-COmgw_chv96DEtcvr7pYQ_bj8ApCBs";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const uidInput = document.getElementById("uid");
  const nameInput = document.getElementById("playerName");
  const registerBtn = document.getElementById("registerBtn");
  const message = document.getElementById("message");
  const count = document.getElementById("count");

  async function updateCount() {
    const { count: total, error } = await supabaseClient
      .from("registrations")
      .select("*", { count: "exact", head: true });

    if (error) {
      count.textContent = "خطا";
      console.error(error);
      return;
    }

    count.textContent = total ?? 0;

    if ((total ?? 0) >= 100) {
      registerBtn.disabled = true;
      registerBtn.textContent = "ظرفیت تکمیل شد";
    }
  }

  registerBtn.addEventListener("click", async () => {
    const uid = uidInput.value.trim();
    const playerName = nameInput.value.trim();

    if (!uid || !playerName) {
      message.textContent = "لطفاً UID و اسم داخل بازی را وارد کنید.";
      return;
    }

    registerBtn.disabled = true;
    registerBtn.textContent = "در حال ثبت...";

    const { data: existing, error: checkError } = await supabaseClient
      .from("registrations")
      .select("id")
      .eq("uid", uid)
      .limit(1);

    if (checkError) {
      message.textContent = "خطا در اتصال به سرور.";
      registerBtn.disabled = false;
      registerBtn.textContent = "ثبت نام";
      return;
    }

    if (existing && existing.length > 0) {
      message.textContent = "این UID قبلاً ثبت نام شده است.";
      registerBtn.disabled = false;
      registerBtn.textContent = "ثبت نام";
      return;
    }

    const { error } = await supabaseClient
      .from("registrations")
      .insert([
        {
          uid: uid,
          player_name: playerName
        }
      ]);

    if (error) {
      console.error(error);
      message.textContent = "ثبت نام انجام نشد.";
      registerBtn.disabled = false;
      registerBtn.textContent = "ثبت نام";
      return;
    }

    message.textContent = "ثبت نام شما با موفقیت انجام شد ✅";

    uidInput.value = "";
    nameInput.value = "";

    registerBtn.textContent = "ثبت شد";

    await updateCount();
  });

  updateCount();
</script>

</body>
</html>
