<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسابقات PUBG</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101318;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 22px 16px;
    }

    .card {
      background: #191e25;
      border: 1px solid #303744;
      border-radius: 18px;
      padding: 18px;
      margin: 14px 0;
    }

    h1 {
      margin: 0 0 8px;
    }

    h2 {
      margin-top: 0;
    }

    .muted {
      color: #aeb6c3;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 7px 0 12px;
      border-radius: 10px;
      border: 1px solid #39414d;
      background: #101318;
      color: #ffffff;
      font-size: 16px; هم 
    }

    input::placeholder {
      color: #7f8997;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 11px;
      background: #ffffff;
      color: #111111;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .capacity {
      font-size: 22px;
      font-weight: bold;
    }

    .bar {
      height: 9px;
      background: #303640;
      border-radius: 9px;
      overflow: hidden;
      margin-top: 10px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: #ffffff;
      transition: width 0.3s;
    }

    #msg {
      margin-top: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="card">
      <h1>🏆 مسابقات PUBG</h1>
      <div class="muted">ثبت نام مسابقه</div>
    </div>

    <div class="card">
      <div class="capacity">
        ظرفیت: <span id="capacity">0 / 100</span>
      </div>

      <div class="bar">
        <div class="fill" id="bar"></div>
      </div>
    </div>

    <div class="card">
      <h2>ثبت نام</h2>

      <form id="form">

        <label for="uid">PUBG اکانت UID</label>
        <input
          id="uid"
          type="text"
          required
          placeholder="UID خود را وارد کنید"
        >

        <label for="name">اسم داخل بازی</label>
        <input
          id="name"
          type="text"
          required
          placeholder="اسم داخل بازی"
        >

        <button id="submitBtn" type="submit">
          ثبت نام
        </button>

      </form>

      <p id="msg" class="muted"></p>
    </div>

    <div class="card">
      <h2>قوانین</h2>
      <p class="muted">
        اطلاعات خود را دقیقاً وارد کنید و فقط با مشخصات خودتان ثبت نام کنید.
      </p>
    </div>

    <div class="card">
      <h2>اطلاعات</h2>
      <p class="muted">
        ظرفیت مسابقه ۱۰۰ نفر است.
      </p>
    </div>

  </div>

  <script>
    const MAX_PLAYERS = 100;

    let registrations =
      JSON.parse(localStorage.getItem("pubg_registrations")) || [];

    const capacity = document.getElementById("capacity");
    const bar = document.getElementById("bar");
    const form = document.getElementById("form");
    const uidInput = document.getElementById("uid");
    const nameInput = document.getElementById("name");
    const msg = document.getElementById("msg");
    const submitBtn = document.getElementById("submitBtn");

    function draw() {
      const count = registrations.length;

      capacity.textContent = `${count} / ${MAX_PLAYERS}`;

      const percent = Math.min((count / MAX_PLAYERS) * 100, 100);
      bar.style.width = percent + "%";

      if (count >= MAX_PLAYERS) {
        submitBtn.disabled = true;
        submitBtn.textContent = "ظرفیت تکمیل شده";
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = "ثبت نام";
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const uid = uidInput.value.trim();
      const playerName = nameInput.value.trim();

      if (!uid || !playerName) {
        msg.textContent = "لطفاً همه اطلاعات را وارد کنید.";
        return;
      }

      if (registrations.length >= MAX_PLAYERS) {
        msg.textContent = "ظرفیت مسابقه تکمیل شده است.";
        return;
      }

      const duplicate = registrations.some(
        player => player.uid === uid
      );

      if (duplicate) {
        msg.textContent = "این UID قبلاً ثبت نام شده است.";
        return;
      }

      registrations.push({
        uid: uid,
        name: playerName,
        time: new Date().toISOString()
      });

      localStorage.setItem(
        "pubg_registrations",
        JSON.stringify(registrations)
      );

      msg.textContent = "✅ ثبت نام شما با موفقیت انجام شد.";

      form.reset();
      draw();
    });

    draw();
  </script>

</body>
</html>
